name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        check-latest: true
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint

    - name: Run unit tests
      run: npm test
      continue-on-error: true

    - name: Build
      run: npm run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build
        path: dist
        retention-days: 7

    - name: Check bundle size
      run: |
        du -sh dist
        find dist -type f -name "*.js" -exec sh -c 'echo "$(echo {} | wc -c) {}"' \; | sort -rn | head -10

  e2e:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        check-latest: true
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright
      run: npx playwright install --with-deps

    - name: Build
      run: npm run build

    - name: Run E2E tests
      run: npm run test:e2e

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7

  visual:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        check-latest: true
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright
      run: npx playwright install --with-deps

    - name: Build
      run: npm run build

    - name: Create baseline snapshots (if missing)
      run: npm run test:visual:update || true

    - name: Run visual regression tests
      run: npm run test:visual
      continue-on-error: true

    - name: Upload visual test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: visual-test-results
        path: test-results/
        retention-days: 7

    - name: Upload visual screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: visual-screenshots
        path: test-results/
        retention-days: 7

  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        check-latest: true
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run security audit
      run: npm audit --audit-level=high
      continue-on-error: true

    - name: Check for vulnerabilities
      run: npm audit --production
      continue-on-error: true
